<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<title>Gabriel Inácio · cidade noir</title>
<meta name="description" content="Gabriel Inácio: engenharia de software, games e IA. Uma cidade noir em 3D com os projetos dele.">
<link rel="canonical" href="https://inaciodev.online/">
<meta name="theme-color" content="#05060c">
<link rel="icon" href="/assets/favicon.png">
<style>
html,body{margin:0;height:100%;background:#05060c;overflow:hidden;touch-action:none}
#canvas{display:block;width:100vw;height:100vh;outline:none}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 70%,#1a0f2e 0%,#05060c 65%);color:#e8e2d0;font-family:Georgia,serif;z-index:5;transition:opacity .6s}
#load h1{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.08em;font-size:clamp(40px,9vw,92px);margin:0;
  color:#f3ead8;text-shadow:0 0 18px #ff4fa3aa,0 0 42px #5aaadc66}
#load p{margin:.6em 0 2em;font-family:'Courier New',monospace;color:#ffb23d;font-size:clamp(13px,2.6vw,18px)}
#bar{width:min(320px,70vw);height:4px;background:#1b1a28;border-radius:2px;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#ff4fa3,#ffc83d);box-shadow:0 0 12px #ff4fa3}
#msg{margin-top:14px;font:12px 'Courier New',monospace;color:#8a86a8}
#rain{position:fixed;inset:0;pointer-events:none;opacity:.25;background:repeating-linear-gradient(100deg,transparent 0 22px,#9fb3ff22 22px 23px);animation:r .6s linear infinite}
@keyframes r{from{background-position:0 0}to{background-position:-40px 160px}}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas" tabindex="0">Seu navegador não suporta WebGL.</canvas>
<div id="load"><div id="rain"></div><h1>GABRIEL INÁCIO</h1><p>engenharia de software · games · IA</p>
<div id="bar"><div id="fill"></div></div><div id="msg">acendendo os neons...</div></div>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":13454344,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const engine = new Engine(GODOT_CONFIG);
const load = document.getElementById('load'), fill = document.getElementById('fill'), msg = document.getElementById('msg');
const missing = Engine.getMissingFeatures({threads: false});
if (missing.length) {
  msg.textContent = 'Seu navegador não suporta este jogo. Veja os projetos em texto na página inicial.';
} else {
  engine.startGame({
    onProgress: (cur, total) => { if (total > 0) fill.style.width = Math.round(cur / total * 100) + '%'; },
  }).then(() => { load.style.opacity = '0'; setTimeout(() => load.remove(), 700); },
         (err) => { msg.textContent = 'Não foi possível abrir a cidade: ' + err; });
}
// sair por engano (voltar do navegador) pede confirmação
window.addEventListener('beforeunload', (e) => { e.preventDefault(); e.returnValue = ''; });
</script>
</body>
</html>
